<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %}</title>
<style>
@font-face { font-family: "Plex Arabic"; src: url("file://{{ fonts_dir }}/IBMPlexSansArabic-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Plex Arabic"; src: url("file://{{ fonts_dir }}/IBMPlexSansArabic-Bold.woff2") format("woff2"); font-weight: 700; }
@page { size: A4; margin: 14mm; }
body { margin: 0; }
{{ shared_css | safe }}
</style>
</head>
<body>
{# The markup in the blocks mirrors apps/web/src/documents/*Document.tsx element for element. #}
<div class="doc" dir="rtl" lang="ar">
{% block content %}{% endblock %}
</div>
</body>
</html>
