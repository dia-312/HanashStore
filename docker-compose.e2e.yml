# Throwaway stack for the browser tests in apps/web/e2e (its own project, port and database, so it never
# touches the dev stack or anything real). The password below is a test value for this stack only.
#   npm --prefix apps/web run build
#   docker compose -p hanash-e2e -f docker-compose.e2e.yml up -d --build
#   docker compose -p hanash-e2e -f docker-compose.e2e.yml exec -T -e ADMIN_PASSWORD=e2e-password-123 api python -m app.cli create-user --name e2e
#   npm --prefix apps/web run e2e
#   docker compose -p hanash-e2e -f docker-compose.e2e.yml down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-db-password
      POSTGRES_DB: e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://e2e:e2e-db-password@postgres:5432/e2e
      COOKIE_SECURE: "false" # plain HTTP on 127.0.0.1
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
      - ./apps/web/public/fonts:/app/fonts:ro # the font the PDF embeds
      - ./shared:/app/shared:ro # the stylesheet and labels the PDF shares with the app
      - ./apps/api/seed-data:/seed:ro # optional large dataset for the speed check
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - media:/media:ro
    depends_on:
      - api

volumes:
  media:
