name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails when the initial JavaScript passes 250 KB gzipped (SPEC section 17).
      - run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sales
          POSTGRES_PASSWORD: sales
          POSTGRES_DB: sales_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sales -d sales_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sales:sales@127.0.0.1:5432/sales_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      # What WeasyPrint needs to shape Arabic: the PDF tests render real files.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests scripts
      - run: pytest -q

  compose-smoke:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Start the stack
        run: |
          sed 's/change-me/ci-only-password/' .env.example > .env
          docker compose up -d --build
      - name: Health and login through Caddy
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health
          docker compose exec -T -e ADMIN_PASSWORD='ci-only-login-password' api python -m app.cli create-user --name CI
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' -H 'X-Requested-With: app' \
            -d '{"password":"ci-only-login-password"}'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # /media is served by Caddy from the shared volume: a missing file is a plain 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/media/nothing.webp)" = 404
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  # The browser journey in WebKit (Safari's engine) against a throwaway stack: login, import, stock,
  # offline stock-in and reconnect, duplicate and refused commands. See scripts/e2e.sh.
  e2e:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
        working-directory: apps/web
      - run: bash scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -p hanash-e2e -f docker-compose.e2e.yml logs
